<!doctype html>
<!-- ponytail: dev data viewer. Talks to existing /api/dashboard/* with a pasted JWT.
     No build step, no framework, no map lib — links to Google Maps instead. -->
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Viewer</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 1.5rem; max-width: 1100px; color: #222; }
  header { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
  input { padding: .4rem .6rem; border: 1px solid #ccc; border-radius: 6px; }
  input#token { flex: 1; min-width: 280px; font-family: monospace; }
  button { padding: .4rem .8rem; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
  .stats { display: flex; gap: 1rem; margin-bottom: 1rem; }
  .stat { background: #f1f5f9; padding: .6rem 1rem; border-radius: 8px; }
  .stat b { display: block; font-size: 1.6rem; }
  .card { border: 1px solid #e2e8f0; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
  .card h3 { margin: 0 0 .4rem; font-size: 1rem; }
  .meta { color: #64748b; font-size: .85rem; margin-bottom: .6rem; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: .25rem .5rem; vertical-align: top; border-top: 1px solid #f1f5f9; }
  td.k { color: #475569; white-space: nowrap; width: 1%; font-weight: 600; }
  img.thumb { max-height: 120px; border-radius: 6px; margin: .2rem .2rem 0 0; }
  a { color: #2563eb; }
  #err { color: #dc2626; }
</style>
</head>
<body>
<header>
  <input id="token" placeholder="paste JWT here" autocomplete="off">
  <input id="date" type="date">
  <button onclick="load()">Load</button>
  <span id="err"></span>
</header>
<div class="stats" id="stats"></div>
<h2>Survey reports</h2>
<div id="reports"></div>
<h2>แจ้งปัญหา (form reports)</h2>
<div id="forms"></div>

<script>
const $ = s => document.querySelector(s);
$('#token').value = localStorage.getItem('token') || '';

const authHeaders = () => ({ Authorization: 'Bearer ' + $('#token').value.trim() });

async function api(path) {
  const r = await fetch(path, { headers: authHeaders() });
  if (!r.ok) throw new Error(path + ' → ' + r.status);
  return r.json();
}

// <img> can't send the JWT header, so fetch each image as an authed blob and swap in an object URL.
async function hydrateImages() {
  for (const img of document.querySelectorAll('img[data-src]')) {
    try {
      const r = await fetch(img.dataset.src, { headers: authHeaders() });
      if (r.ok) img.src = URL.createObjectURL(await r.blob());
      else img.replaceWith(Object.assign(document.createElement('span'), { textContent: `🖼️✗ ${r.status}` }));
    } catch { /* leave broken img */ }
  }
}

function renderVal(v) {
  if (v && typeof v === 'object') {
    if (v.image_id) return ''; // images shown separately
    return '<pre style="margin:0">' + JSON.stringify(v, null, 1) + '</pre>';
  }
  return v == null ? '' : String(v);
}

function card(r) {
  const rows = Object.entries(r.payload || {})
    .map(([k, v]) => `<tr><td class="k">${k}</td><td>${renderVal(v)}</td></tr>`).join('');
  const imgs = (r.images || [])
    .map(i => `<img class="thumb" data-src="${i.image_url}">`).join('');
  const loc = (r.latitude != null && r.longitude != null)
    ? `<a href="https://maps.google.com/?q=${r.latitude},${r.longitude}" target="_blank">📍 ${r.latitude.toFixed(5)}, ${r.longitude.toFixed(5)}</a>` : '';
  return `<div class="card">
    <h3>#${r.report_id} · ${r.survey_version}</h3>
    <div class="meta">${r.created_at} · ${r.lineuser_id} ${loc ? '· ' + loc : ''}</div>
    <table>${rows}</table>${imgs}
  </div>`;
}

function formCard(r) {
  const loc = (r.latitude != null && r.longitude != null)
    ? `<a href="https://maps.google.com/?q=${r.latitude},${r.longitude}" target="_blank">📍 ${r.latitude.toFixed(5)}, ${r.longitude.toFixed(5)}</a>` : '';
  const img = r.image_url
    ? `<img class="thumb" data-src="${r.image_url}">` : '';
  return `<div class="card">
    <h3>#${r.report_id} · ${r.category || 'uncategorized'} · ${r.status}</h3>
    <div class="meta">${r.created_at} · ${r.lineuser_id || 'anonymous'} ${loc ? '· ' + loc : ''}</div>
    <div>${r.description || ''}</div>${img}
  </div>`;
}

async function load() {
  $('#err').textContent = '';
  localStorage.setItem('token', $('#token').value.trim());
  try {
    const stats = await api('/api/dashboard/stats');
    $('#stats').innerHTML = `
      <div class="stat"><b>${stats.total_users}</b>users</div>
      <div class="stat"><b>${stats.total_completed_reports}</b>completed</div>
      <div class="stat"><b>${stats.total_incomplete_reports}</b>incomplete</div>`;
    const d = $('#date').value;
    // limit=200 = ดูให้ครบในหน้าเดียว (default API = 20). endpoint คืน envelope {items,...}
    const q = (d ? '?date=' + d + '&' : '?') + 'limit=200';
    const reports = (await api('/api/dashboard/reports' + q)).items;
    $('#reports').innerHTML = reports.length
      ? reports.map(card).join('') : '<p>No reports.</p>';
    const forms = (await api('/api/dashboard/form-reports' + q)).items;
    $('#forms').innerHTML = forms.length
      ? forms.map(formCard).join('') : '<p>No form reports.</p>';
    hydrateImages();
  } catch (e) {
    $('#err').textContent = e.message;
  }
}

if ($('#token').value) load();
</script>
</body>
</html>
